services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sale_scheduler
      POSTGRES_USER: sale_scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - sale_scheduler_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sale_scheduler -d sale_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://sale_scheduler:${POSTGRES_PASSWORD}@db:5432/sale_scheduler
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sale_scheduler:${POSTGRES_PASSWORD}@db:5432/sale_scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sale_scheduler:${POSTGRES_PASSWORD}@db:5432/sale_scheduler
      WORKER_ID: ${WORKER_ID:-sale-scheduler-worker-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    profiles: ["production"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required for production Caddy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  sale_scheduler_pgdata:
  caddy_data:
  caddy_config:
