name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and fake API tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production Compose and backup script
        run: |
          cp .env.production.example .env.production
          POSTGRES_PASSWORD=ci-only DATABASE_URL=postgresql://sale_scheduler:ci-only@db:5432/sale_scheduler APP_DOMAIN=localhost docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          bash -n infra/scripts/backup-postgres.sh
          rm -f .env.production
      - name: Build production images
        run: |
          POSTGRES_PASSWORD=ci-only APP_DOMAIN=localhost docker compose build web worker migrate
